; HIPCMS database connection settings
; ---------------------------------------------------------------
; Edit user / password to match YOUR MySQL server, then run:
;     python setup_database.py      (creates the hipcms database)
;     python gui_app.py             (starts the UI)
;
; backend = mysql   -> real MySQL 8.0 server (required for the demo)
; backend = sqlite  -> offline fallback copy, no server needed
; ---------------------------------------------------------------
[database]
backend  = mysql
host     = 127.0.0.1
port     = 3306
user     = root
password =
database = hipcms
